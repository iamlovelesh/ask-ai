# Retrieval probe set (LLD §4 / Task 10).
#
# 60 queries: ≥20 "paraphrase" (no lexical overlap with the target action's
# name/slug words — e.g. "customers who haven't paid us yet" for
# invoices.list_overdue_invoices), ≥12 "typo" (misspelled direct queries —
# minisearch `fuzzy: 0.2` + `prefix: true` must still find the action), and
# the rest "direct" (close to the action's own name/words). Spread across
# ≥25 of the 50 catalog modules.
#
# `expect` is the set of ACCEPTABLE slugs for that query — `retrieve()`
# passes the probe if ANY of them appears in its top-20 cards.
# `scripts/probe.ts` computes recall@20 overall and per-category and fails
# the gate below 0.95 (LLD §4).

- q: create a contact
  category: direct
  expect: [contacts.create_contact]
