# Task 17 Batch C — category: direct, module: communities (2nd scenario;
# lint gap: communities touched by only 1 scenario before this — the
# existing multistep-communities-001 is a 4-action multistep flow;
# this one is a plain single-action direct read).
#
# get_community_details is a plain read — same minimal-risk pattern as
# typo-calendars-001 (mustInclude the slug + mustMention the slug in the
# response), so no state derivation is needed.
#
# Derivation (template copy):
#   SELECT id,name FROM structures WHERE kind='community' AND name='community 2';
#   -> struct_297, 'community 2' (exists, unique name)

id: direct-communities-002
category: direct
profile: standard
turns:
  - user: "Tell me about the 'community 2' community."
    expect:
      planActions:
        mustInclude: [communities.get_community_details]
      behavior:
        confirmation: false
      response:
        # CORRECTION (task-harness-fairness, see eval/SCENARIO-CORRECTIONS.md):
        # composer.ts renders the community's own `name` field, never the
        # slug — "community 2" is the entity the slug implied (verified
        # against server/data/crm-standard.template.db: struct_297).
        mustMention: ["community 2"]
        mustNotClaim: [failed, error]
