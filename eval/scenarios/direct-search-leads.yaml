# Seed scenario (Task 16) — category: direct.
#
# A single-turn, single-action read: the simplest possible shape, used both
# to sanity-check the machinery end-to-end and as the scripted scenario for
# `eval/test/runner-e2e.test.ts` (the one offline, real-spawned-server,
# MockLLM proof of the full loop).

id: direct-search-leads
category: direct
profile: standard
turns:
  - user: "Show me leads created in the last week"
    expect:
      planActions:
        mustInclude: [leads.search_leads]
        mustNotInclude: [leads.create_lead, leads.update_lead_details]
      behavior:
        confirmation: false
      response:
        # CORRECTION (task-harness-fairness, see eval/SCENARIO-CORRECTIONS.md):
        # the original comment above described `step.finished.summary`
        # (an internal event field, "<action>: <N> record(s)"), NOT
        # `answer.final` — composer.ts (LLD §5, "no LLM call, ever", and
        # its own grounding contract #4) deliberately never lets a dotted
        # tool slug reach answer.final. "leads" is the plain-English
        # module noun its template always uses instead (found or empty
        # branch alike), so it's a safe, grounded stand-in.
        mustMention: ["leads"]
        mustNotClaim: [failed, error]
