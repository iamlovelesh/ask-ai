# Misspelled direct request ("Waht"/"detials"/"Sles"). Team names are
# unique in this seed (6 distinct / 6 rows), so 'Enterprise Sales'
# resolves cleanly despite the typo.

id: typo-teams-001
category: direct
subtype: typo
profile: standard
turns:
  - user: "Waht are the detials for the Enterprise Sles team?"
    expect:
      planActions:
        mustInclude: [teams.get_team_details]
      behavior:
        confirmation: false
      response:
        # CORRECTION (task-harness-fairness, see eval/SCENARIO-CORRECTIONS.md):
        # composer.ts renders the team's own `name` field, never the
        # slug — "Enterprise Sales" is team_1's actual name (verified
        # against server/data/crm-standard.template.db).
        mustMention: ["Enterprise Sales"]
        mustNotClaim: [failed, error]
