# Task 17 Batch A — category: direct, module: tags.
#
# apply_tag_to_record (risk: write) with a literal `target_type` enum.
# 'tag 3' is a uniquely-named tag definition (30 distinct names / 30 rows).
# Target contact referenced by unique email (see direct-notes-001's
# comment on why — contact display names collide 10x in this seed).
#
# Derivation (template copy):
