id: direct-tags-001
category: direct
profile: standard
turns:
  - user: "Apply the 'tag 3' tag to the contact with email kenji.volkov2246@company.com"
    expect:
      planActions:
        mustInclude: [tags.apply_tag_to_record]
      paramChecks:
        - action: tags.apply_tag_to_record
          param: target_type
          equals: contact
      state:
        - query: "SELECT COUNT(*) AS n FROM contacts WHERE id='con_1' AND tags LIKE '%tag 3%'"
          countDelta: 1
      behavior:
        confirmation: false
