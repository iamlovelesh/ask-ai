# Task 17 Batch A — category: direct, subtype: typo, module: calendars.
#
# Misspelled direct request ("calender"/"too"). Calendar names are unique
# in this seed (10 distinct / 10 rows), so 'calendar 5' resolves cleanly.

id: typo-calendars-001
category: direct
subtype: typo
profile: standard
turns:
  - user: "Rename calender 'calendar 5' too 'Enterprise Demos'"
    expect:
      planActions:
        mustInclude: [calendars.update_calendar_details]
      behavior:
        confirmation: false
      response:
        # CORRECTION (task-harness-fairness, see eval/SCENARIO-CORRECTIONS.md):
        # composer.ts's write-leaf renderer names the record by its own
        # post-write `name` field, never the slug — "Enterprise Demos" is
        # the new name the user's own request asked for.
        mustMention: ["Enterprise Demos"]
        mustNotClaim: [failed, error]
