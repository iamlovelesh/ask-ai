# Task 17 Batch A — category: direct, subtype: typo, module: quotes.
#
# Misspelled direct request ("Creat"/"qoute"). Contact referenced by
# unique email (see direct-notes-001's comment on contact-name collisions).

id: typo-quotes-001
category: direct
subtype: typo
profile: standard
turns:
  - user: "Creat a new qoute for the contact at lucia.berg3024@yahoo.com"
    expect:
      planActions:
        mustInclude: [quotes.create_quote]
      behavior:
        confirmation: false
      response:
        # CORRECTION (task-harness-fairness, see eval/SCENARIO-CORRECTIONS.md):
        # composer.ts's write-leaf renderer names the record by the
        # catalog's own generated id (no name field on QuoteView) — every
        # created quote's id is prefixed "quote_" (next-id.ts), so
        # "quote" is a safe, grounded substring regardless of the exact
        # generated number.
        mustMention: ["quote"]
        mustNotClaim: [failed, error]
