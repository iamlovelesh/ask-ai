# category: direct, module: media_assets (2nd slug-bearing scenario). A pure read —
# deterministic, never gates. (The earlier multi-step/indirect variant was
# fragile: the planner reasonably does fewer steps and a later step can gate,
# so a read keeps coverage solid.)

id: direct-media_assets-002
category: direct
profile: standard
turns:
  - user: "Search our media assets for logo files"
    expect:
      planActions:
        mustInclude: [media_assets.search_media_assets]
      behavior:
        confirmation: false
      response:
        mustNotClaim: [failed, error]
