# category: direct, module: business_listings (2nd slug-bearing scenario). A pure read —
# deterministic, never gates. (The earlier multi-step/indirect variant was
# fragile: the planner reasonably does fewer steps and a later step can gate,
# so a read keeps coverage solid.)

id: direct-business_listings-002
category: direct
profile: standard
turns:
  - user: "Search our business listings"
    expect:
      planActions:
        mustInclude: [business_listings.search_business_listings]
      behavior:
        confirmation: false
      response:
        mustNotClaim: [failed, error]
