# Task 17 Batch C — category: failure, module: support_tickets.
#
# NOT_FOUND injection — honest failure surfacing. Same shape as this
# batch's `failure-tasks-not-found`/`failure-contacts-not-found`.
#
# Derivation (template copy):
#   SELECT id FROM support_tickets WHERE id='ticket_1'; -> exists — the
#     injected NOT_FOUND fires regardless of the real row existing.

id: failure-support_tickets-not-found
category: failure
profile: standard
injectFailures:
  - action: support_tickets.get_ticket_details
    code: NOT_FOUND
    times: 1
turns:
  - user: "Pull up the details on support ticket ticket_1."
    expect:
      planActions:
        mustInclude: [support_tickets.get_ticket_details]
      behavior:
        status: failed
