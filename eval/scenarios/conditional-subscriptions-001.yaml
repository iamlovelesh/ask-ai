# Task 17 Batch B part 1 — category: conditional, module: subscriptions.
#
# `pause_subscription` is `risk: 'write'` (m30-subscriptions.ts A07) — per
# `shouldGate` (executor.ts) a plain write only gates past the 50-row
# bulk threshold. The qualifying set here is tiny, so no confirmation is
# expected (same reasoning as `conditional-opportunities-001`, contrast
# with the destructive/external scenarios elsewhere in this batch that
# gate unconditionally).
#
# Derivation (template copy):
#   SELECT product_id, COUNT(*) FROM subscriptions WHERE status='active'
#     GROUP BY product_id ORDER BY COUNT(*) DESC LIMIT 1;
#   -> prod_11 ("Growth Suite"), 4 active subscriptions
#   4 <= 50 -> no bulk gate; risk='write' -> no gate either way.

id: conditional-subscriptions-001
category: conditional
profile: standard
turns:
  - user: >-
      Pause every active subscription for the "Growth Suite" product
      (prod_11) — we're pausing billing on it for now.
    expect:
      planActions:
        mustInclude:
          - subscriptions.search_subscriptions
          - subscriptions.pause_subscription
        mustNotInclude: [subscriptions.cancel_subscription]
      state:
        - query: "SELECT COUNT(*) AS n FROM subscriptions WHERE product_id='prod_11' AND status='paused'"
          countDelta: 4
      behavior:
        confirmation: true
      response:
        mustNotClaim: [failed, error]
