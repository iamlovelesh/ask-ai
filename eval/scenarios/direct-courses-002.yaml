# category: direct, module: courses (2nd slug-bearing scenario). A pure read —
# deterministic, never gates. (The earlier multi-step/indirect variant was
# fragile: the planner reasonably does fewer steps and a later step can gate,
# so a read keeps coverage solid.)

id: direct-courses-002
category: direct
profile: standard
turns:
  - user: "Search our courses about sales"
    expect:
      planActions:
        mustInclude: [courses.search_courses]
      behavior:
        confirmation: false
      response:
        mustNotClaim: [failed, error]
