# Task 17 Batch C — category: failure, module: invoices.
#
# TRANSIENT x1 on a single-action turn — same retry-then-succeed shape as
# this batch's `failure-payments-transient-retry` scenario: the injected
# failure is consumed on attempt 1, the real handler runs clean on
# attempt 2 (executor.ts's `invoke`), and the final state/response are
# identical to the no-failure case.
#
# Derivation (template copy):
#   SELECT id,status FROM invoices WHERE id='inv_100'; -> status='issued'
#     (exists) — send_invoice_reminder doesn't change invoice status, so
#     this scenario only asserts the plan/response shape, not a state
#     delta (no reliable literal side-effect column to query for this
#     action).
#
# CORRECTION (hardening review, round 2): `behavior.confirmation` was
# `false`, but `invoices.send_invoice_reminder` is `risk: 'external'`
# (m28-invoices.ts), which `shouldGate` (executor.ts) ALWAYS gates
# regardless of affected count — same reasoning every sibling
# `send_invoice_reminder` scenario already asserts
# (`followup-invoices-reminders`, `conditional-invoices-001`,
# `indirect-invoices-001`: all `confirmation: true`). With `false`, the
# runner (`eval/runner.ts`) auto-DENIES the `confirmation.required`
# event instead of approving it, so the action step would never
# actually execute, the injected TRANSIENT failure would never get a
# chance to be consumed on a real attempt, and the "retry-then-succeed,
# final state/response identical to the no-failure case" narrative above
# would be false. Fixed to `true` so the runner auto-approves
# (`eval/runner.ts`'s `expectConfirmation` -> `approved: true`) and the
# scenario's own derivation comment is actually what happens: attempt 1
# consumes the injected TRANSIENT, attempt 2 runs clean post-approval.

id: failure-invoices-transient-retry
category: failure
profile: standard
injectFailures:
  - action: invoices.send_invoice_reminder
    code: TRANSIENT
    times: 1
turns:
  - user: "Send a payment reminder for invoice inv_100."
    expect:
      planActions:
        mustInclude: [invoices.send_invoice_reminder]
      behavior:
        confirmation: true
      response:
        mustNotClaim: [failed, error]
