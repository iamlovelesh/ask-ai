# Task 17 Batch B part 1 — category: multistep, module: reports (+leads).
#
# `run_report`'s `leads_by_source` aggregation (m50-reports.ts:116-128) is
# `GROUP BY source over leads WHERE archived=0`, date-ranged only if the
# report's saved `date_range` is set — a freshly-created report defaults
# to `{from: null, to: null}` (all-time), so no date filter applies here.
#
# Derivation (template copy):
#   SELECT source, COUNT(*) FROM leads WHERE archived=0 GROUP BY source
#     ORDER BY COUNT(*) DESC;
#   -> 'website' is the top source with 667 (the leads table in this
#     template copy has 0 archived rows, so WHERE archived=0 changes
#     nothing vs. an unfiltered count).

id: multistep-reports-001
category: multistep
profile: standard
turns:
  - user: >-
      Set up a leads-by-source report and run it — tell me which source
      brings in the most leads and how many.
    expect:
      planActions:
        mustInclude:
          - reports.create_saved_report
          - reports.run_report
      paramChecks:
        - action: reports.create_saved_report
          param: type
          equals: leads_by_source
      state:
        - query: "SELECT COUNT(*) AS n FROM structures WHERE kind='report' AND config LIKE '%leads_by_source%'"
          countDelta: 1
      behavior:
        confirmation: false
      response:
        mustMention: ["website", "667"]
        mustNotClaim: [failed, error]
