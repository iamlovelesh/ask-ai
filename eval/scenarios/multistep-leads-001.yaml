# Task 17 Batch B part 1 — category: multistep, module: leads (+tasks).
#
# Indirect phrasing on purpose ("gone quiet" names no explicit filter) —
# the planner must translate it into a real `leads.search_leads` filter
# (e.g. status='contacted' with no recent reply) and then create follow-up
# tasks for the matches. Unlike `multistep-lead-sweep.yaml`'s flagship
# 9-step DSL-conformance fixture, this scenario only needs the ESSENTIAL
# two-module slug pair — the exact search filter the planner picks is
# legitimately plan-dependent for an indirect prompt like this.
#
# Derivation (template copy): "quiet" leads are a `status='contacted'`
# cohort — `SELECT COUNT(*) FROM leads WHERE status='contacted'` -> 1252
# (template copy) — large and open-ended for an indirect ask, so the
# exact count of follow-up tasks created is plan-dependent (how narrowly
# the planner scopes "gone quiet"). `SELECT COUNT(*) FROM tasks` -> 1500
# before the turn; the state check below asserts a post-turn floor of
# 1501 (>= 1 new follow-up task), matching the LLD's `countDelta`-vs-`gte`
# guidance for exactly this "derived floor, not an exact bulk count" case.

id: multistep-leads-001
category: multistep
profile: standard
turns:
  - user: >-
      Help me follow up with leads who have gone quiet lately — find them
      and get a follow-up task queued for each one.
    expect:
      planActions:
        mustInclude:
          - leads.search_leads
          - tasks.create_task
        mustNotInclude: [leads.create_lead]
      state:
        - query: "SELECT COUNT(*) AS n FROM tasks"
          gte: 1501
      response:
        mustNotClaim: [failed, error]
