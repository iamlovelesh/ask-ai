# Task 17 Batch C — category: direct, module: quotes (corpus padding —
# quotes already clears the lint module-coverage floor).
#
# get_quote_details is a plain read — same minimal-risk pattern as
# typo-calendars-001 (mustInclude the slug + mustMention the slug in the
# response), so no state derivation is needed.
#
# Derivation (template copy):
#   SELECT id FROM quotes WHERE id='quote_1'; -> exists

id: direct-quotes-003
category: direct
profile: standard
turns:
  - user: "Show me the details on quote_1."
    expect:
      planActions:
        mustInclude: [quotes.get_quote_details]
      behavior:
        confirmation: false
      response:
        # CORRECTION (task-harness-fairness, see eval/SCENARIO-CORRECTIONS.md):
        # QuoteView has no name/title field, so composer.ts's
        # describeSingleRecord falls through to the record's amount
        # (total_cents, the catalog's money-field convention) — "$3291.48"
        # is quote_1's actual total (verified against
        # server/data/crm-standard.template.db: total_cents=329148).
        mustMention: ["$3291.48"]
        mustNotClaim: [failed, error]
