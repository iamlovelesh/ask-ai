# category: direct, module: blogs (2nd slug-bearing scenario). A pure read —
# deterministic, never gates. (The earlier multi-step/indirect variant was
# fragile: the planner reasonably does fewer steps and a later step can gate,
# so a read keeps coverage solid.)

id: direct-blogs-002
category: direct
profile: standard
turns:
  - user: "Search our blog posts about the product launch"
    expect:
      planActions:
        mustInclude: [blogs.search_blog_posts]
      behavior:
        confirmation: false
      response:
        mustNotClaim: [failed, error]
